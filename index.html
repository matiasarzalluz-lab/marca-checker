<!DOCTYPE html>
<html>
<head>
  <title>Verificador de Marcas</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;
    const MarcaChecker = () => {
      const [marca, setMarca] = useState('');
      const [resultados, setResultados] = useState(null);
      const [cargando, setCargando] = useState(false);
      const API_URL = 'https://marca-checker.vercel.app';
      
      const handleBuscar = async (e) => {
        e.preventDefault();
        setCargando(true);
        try {
          const r = await fetch(`${API_URL}/api/buscar-marca`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({marca})});
          const d = await r.json();
          setResultados(d);
        } catch(err) {
          alert('Error: ' + err.message);
        }
        setCargando(false);
      };
      
      return <div style={{padding:'40px', fontFamily:'system-ui'}}>
        <h1>📋 Verificador de Marcas INPI</h1>
        <form onSubmit={handleBuscar}>
          <input type="text" value={marca} onChange={(e)=>setMarca(e.target.value)} placeholder="Marca" style={{padding:'10px', marginRight:'10px'}}/>
          <button disabled={cargando}>{cargando ? 'Buscando...' : 'Buscar'}</button>
        </form>
        {resultados && <div style={{marginTop:'20px', padding:'20px', background:'#f0f0f0', borderRadius:'8px'}}>
          <h2>{resultados.marca}</h2>
          <p><strong>Estado:</strong> {resultados.disponible ? '✅ Disponible' : '⚠️ Conflictos'}</p>
          <p><strong>Clases:</strong> {resultados.clasesRecomendadas.join(', ')}</p>
          {resultados.conflictos.length > 0 && <div>
            <h3>Conflictos:</h3>
            {resultados.conflictos.map((c,i)=><div key={i}>{c.marca} - {c.titular}</div>)}
          </div>}
        </div>}
      </div>;
    };
    ReactDOM.createRoot(document.getElementById('root')).render(<MarcaChecker />);
  </script>
</body>
</html>
